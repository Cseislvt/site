<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Сервер - CSEISLVT</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            background-image: url('/minecraft.png'); 
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            color: #ffffff; overflow-x: hidden; line-height: 1.6; min-height: 100vh;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; text-align: center; }
        
        .back-link { display: inline-block; margin-bottom: 30px; color: #ffffff; text-decoration: none; font-size: 0.9rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .back-link:hover { color: #cccccc; }
        
        header { padding: 40px 0 20px 0; animation: fadeInUp 1s ease forwards; }
        header h1 { font-size: 3rem; font-weight: 700; margin-bottom: 10px; background: linear-gradient(180deg, #fff 0%, #ddd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        header p { color: #f0f0f0; font-size: 1.1rem; font-weight: 300; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        /* ДИНАМИЧЕСКИЙ ВИДЖЕТ СТАТУСА */
        .status-card {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: fadeInUp 1.1s ease forwards;
        }
        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #aaaaaa;
            transition: all 0.3s ease;
        }
        .status-dot.online {
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }
        .status-dot.offline {
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }
        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .players-count {
            color: #aaaaaa;
            font-size: 0.95rem;
        }
        .server-version {
            font-size: 0.85rem;
            color: #777777;
        }

        .action-buttons { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; animation: fadeInUp 1.2s ease forwards; }
        .action-btn { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 25px; border-radius: 12px; font-size: 1.2rem; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none; position: relative; transition: all 0.3s ease; display: block; width: 100%; }
        .action-btn:hover { transform: translateY(-3px); background: rgba(0, 0, 0, 0.8); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .btn-subtext { display: block; font-size: 0.9rem; color: #ccc; font-weight: 400; margin-top: 5px; }
        .copy-toast { position: absolute; top: 15px; right: 20px; background: #ffffff; color: #000000; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; opacity: 0; transform: translateY(5px); transition: all 0.3s ease; pointer-events: none; }
        .copy-toast.show { opacity: 1; transform: translateY(0); }
        footer { text-align: center; margin-top: 100px; padding: 20px; color: #ffffff; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.2); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Вернуться на главную</a>
        <header>
            <h1>Minecraft Сервер</h1>
            <p>Собственный сервер с приватностью и white-list'ом.</p>
        </header>

        <!-- ДИНАМИЧЕСКИЙ БЛОК СТАТУСА -->
        <div class="status-card">
            <div class="status-header">
                <div id="statusDot" class="status-dot"></div>
                <div class="status-text">
                    Статус: <span id="statusLabel">Проверка...</span>
                </div>
            </div>
            <div id="playersCount" class="players-count"></div>
            <div id="serverVersion" class="server-version"></div>
        </div>

        <div class="action-buttons">
            <div class="action-btn" onclick="copyServerIP(this)">
                Скопировать IP сервера
                <span class="btn-subtext">Нажми, чтобы скопировать: mc.cseislvt.online</span>
                <div class="copy-toast">IP скопирован!</div>
            </div>
        </div>
        <footer>&copy; 2026 CSEISLVT. Все права защищены.</footer>
    </div>

    <script>
        const serverIP = 'mc.cseislvt.online';

        function copyServerIP(element) {
            navigator.clipboard.writeText(serverIP).then(() => {
                const toast = element.querySelector('.copy-toast');
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            }).catch(err => { console.error('Ошибка копирования: ', err); });
        }

        // РАБОЧИЙ СКРИПТ ЧЕРЕЗ CORS-ПРОКСИ
        async function checkServerStatus() {
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusLabel');
            const players = document.getElementById('playersCount');
            const version = document.getElementById('serverVersion');

            try {
                // Используем стабильный прокси, чтобы обойти сетевые затыки браузера
                const response = await fetch(`https://herokuapp.com{serverIP}`);
                if (!response.ok) throw new Error('Proxy error');
                
                const data = await response.json();

                if (data && data.online === true) {
                    dot.className = 'status-dot online';
                    label.innerText = 'В СЕТИ';
                    label.style.color = '#2ecc71';
                    
                    const onlineNow = data.players?.online ?? 0;
                    const onlineMax = data.players?.max ?? 20;
                    players.innerText = `Игроки: ${onlineNow} / ${onlineMax}`;
                    
                    if (data.version?.name) {
                        version.innerText = `Версия: ${data.version.name}`;
                    }
                } else {
                    setOffline();
                }
            } catch (error) {
                console.error('Ошибка:', error);
                setOffline();
            }

            function setOffline() {
                dot.className = 'status-dot offline';
                label.innerText = 'ОФФЛАЙН';
                label.style.color = '#e74c3c';
                players.innerText = 'Сервер временно недоступен';
                version.innerText = '';
            }
        }

        checkServerStatus();
    </script>
</body>
</html>
