<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Сервер - CSEISLVT</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            background-image: url('/minecraft.png'); 
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            color: #ffffff; overflow-x: hidden; line-height: 1.6; min-height: 100vh;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; text-align: center; }
        
        .back-link { display: inline-block; margin-bottom: 30px; color: #ffffff; text-decoration: none; font-size: 0.9rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .back-link:hover { color: #cccccc; }
        
        header { padding: 40px 0 20px 0; animation: fadeInUp 1s ease forwards; }
        header h1 { font-size: 3rem; font-weight: 700; margin-bottom: 10px; background: linear-gradient(180deg, #fff 0%, #ddd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        header p { color: #f0f0f0; font-size: 1.1rem; font-weight: 300; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        /* ДИНАМИЧЕСКИЙ ВИДЖЕТ СТАТУСА */
        .status-card {
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: fadeInUp 1.1s ease forwards;
        }

        /* Иконка сервера + MOTD */
        .server-top {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .server-icon {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            image-rendering: pixelated;
            border: 1px solid rgba(255,255,255,0.15);
            flex-shrink: 0;
        }
        .motd {
            font-size: 0.95rem;
            color: #dddddd;
            text-align: left;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
            word-break: break-word;
        }

        .status-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #aaaaaa;
            transition: all 0.3s ease;
        }
        .status-dot.online {
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }
        .status-dot.offline {
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }
        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .players-count {
            color: #aaaaaa;
            font-size: 0.95rem;
        }

        /* Список игроков */
        .players-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }
        .player-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #dddddd;
        }
        .no-players {
            font-size: 0.8rem;
            color: #777777;
            font-style: italic;
        }

        .server-version {
            font-size: 0.85rem;
            color: #777777;
        }
        .server-info {
            font-size: 0.8rem;
            color: #666666;
        }
        .updated-info {
            font-size: 0.75rem;
            color: #555555;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 8px;
            width: 100%;
        }

        .action-buttons { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; animation: fadeInUp 1.2s ease forwards; }
        .action-btn { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 25px; border-radius: 12px; font-size: 1.2rem; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none; position: relative; transition: all 0.3s ease; display: block; width: 100%; }
        .action-btn:hover { transform: translateY(-3px); background: rgba(0, 0, 0, 0.8); border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .btn-subtext { display: block; font-size: 0.9rem; color: #ccc; font-weight: 400; margin-top: 5px; }
        .copy-toast { position: absolute; top: 15px; right: 20px; background: #ffffff; color: #000000; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; opacity: 0; transform: translateY(5px); transition: all 0.3s ease; pointer-events: none; }
        .copy-toast.show { opacity: 1; transform: translateY(0); }
        footer { text-align: center; margin-top: 100px; padding: 20px; color: #ffffff; font-size: 0.85rem; border-top: 1px solid rgba(255, 255, 255, 0.2); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Вернуться на главную</a>
        <header>
            <h1>Minecraft Сервер</h1>
            <p>Собственный сервер с приватностью и white-list'ом.</p>
        </header>

        <!-- ДИНАМИЧЕСКИЙ БЛОК СТАТУСА -->
        <div class="status-card">
            <div class="server-top">
                <img id="serverIcon" class="server-icon" alt="Иконка сервера" hidden>
                <div id="serverMotd" class="motd">Загрузка информации...</div>
            </div>

            <div class="status-header">
                <div id="statusDot" class="status-dot"></div>
                <div class="status-text">
                    Статус: <span id="statusLabel">Проверка...</span>
                </div>
            </div>

            <div id="playersCount" class="players-count"></div>
            <div id="playersList" class="players-list"></div>
            <div id="serverVersion" class="server-version"></div>
            <div id="serverInfo" class="server-info"></div>
            <div id="updatedInfo" class="updated-info">Данные ещё не получены</div>
        </div>

        <div class="action-buttons">
            <div class="action-btn" onclick="copyServerIP(this)">
                Скопировать IP сервера
                <span class="btn-subtext">Нажми, чтобы скопировать: mc.cseislvt.online</span>
                <div class="copy-toast">IP скопирован!</div>
            </div>
        </div>
        <footer>&copy; 2026 CSEISLVT. Все права защищены.</footer>
    </div>

    <script>
        const serverIP = 'mc.cseislvt.online';
        const apiUrl = 'https://obsidian-mc.ru/api/monitoring/v1/servers/VPl1GpA6eO/status/mc.cseislvt.online';
        let lastUpdated = null; 

        function copyServerIP(element) {
            navigator.clipboard.writeText(serverIP).then(() => {
                const toast = element.querySelector('.copy-toast');
                toast.classList.add('show');
                setTimeout(() => { toast.classList.remove('show'); }, 2000);
            }).catch(err => { console.error('Ошибка копирования: ', err); });
        }

        // Экранирование HTML (чтобы ник игрока не сломал вёрстку)
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ПРОВЕРКА СТАТУСА ЧЕРЕЗ API OBSIDIAN-MC.RU
        async function checkServerStatus() {
            const dot         = document.getElementById('statusDot');
            const label       = document.getElementById('statusLabel');
            const players     = document.getElementById('playersCount');
            const playersList = document.getElementById('playersList');
            const version     = document.getElementById('serverVersion');
            const info        = document.getElementById('serverInfo');
            const icon        = document.getElementById('serverIcon');
            const motd        = document.getElementById('serverMotd');
            const updated     = document.getElementById('updatedInfo');

            lastUpdated = Date.now();

            function setOffline() {
                dot.className = 'status-dot offline';
                label.innerText = 'ОФФЛАЙН';
                label.style.color = '#e74c3c';
                players.innerText = 'Сервер временно недоступен';
                version.innerText = '';
                info.innerText = '';
                playersList.innerHTML = '';
                icon.hidden = true;
                motd.innerHTML = '<span style="color:#888">Нет данных</span>';
            }

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('HTTP error! status: ' + response.status);

                const data = await response.json();

                // Универсальный парсер. Ищем данные в разных возможных форматах API
                const isOnline = data.online === true || data.status === true || data.status === 'online' || data.online === 'online';
                
                // MOTD (Описание)
                let motdHtml = '';
                if (data.motd) {
                    if (typeof data.motd === 'string') motdHtml = data.motd;
                    else if (data.motd.html) motdHtml = data.motd.html.join('<br>');
                    else if (data.motd.clean) motdHtml = Array.isArray(data.motd.clean) ? data.motd.clean.join('<br>') : data.motd.clean;
                }
                motd.innerHTML = motdHtml || '<span style="color:#888">MOTD не установлен</span>';

                // Иконка сервера
                const iconSrc = data.icon || data.favicon;
                if (iconSrc) {
                    icon.src = iconSrc;
                    icon.hidden = false;
                } else {
                    icon.hidden = true;
                }

                if (isOnline) {
                    dot.className = 'status-dot online';
                    label.innerText = 'В СЕТИ';
                    label.style.color = '#2ecc71';

                    // Игроки (проверяем где они лежат в API)
                    let onlineNow = 0;
                    let onlineMax = 0;
                    
                    if (typeof data.players === 'number') onlineNow = data.players;
                    else if (data.players?.online !== undefined) onlineNow = data.players.online;
                    else if (data.players_online !== undefined) onlineNow = data.players_online;

                    if (typeof data.max_players === 'number') onlineMax = data.max_players;
                    else if (data.players?.max !== undefined) onlineMax = data.players.max;
                    else if (data.players_max !== undefined) onlineMax = data.players_max;
                    else onlineMax = 20; // дефолт

                    players.innerText = `Игроки: ${onlineNow} / ${onlineMax}`;

                    // Список игроков (если API его отдает)
                    const list = data.players?.list || data.players_list || [];
                    if (list.length > 0) {
                        playersList.innerHTML = list
                            .map(p => `<span class="player-chip">${esc(p.name_clean || p.name || p)}</span>`)
                            .join('');
                    } else if (onlineNow > 0) {
                        playersList.innerHTML = '<span class="no-players">Список игроков скрыт сервером</span>';
                    } else {
                        playersList.innerHTML = '<span class="no-players">Сейчас на сервере никого нет</span>';
                    }

                    // Версия
                    let versionStr = '';
                    if (typeof data.version === 'string') versionStr = data.version;
                    else if (data.version?.name_clean) versionStr = data.version.name_clean;
                    else if (data.version?.name) versionStr = data.version.name;
                    
                    version.innerText = versionStr ? `Версия: ${versionStr}` : '';

                    // Доп. информация (очищаем, так как формат API неизвестен)
                    info.innerText = '';

                } else {
                    setOffline();
                }
            } catch (error) {
                console.error('Ошибка при запросе к API:', error);
                setOffline();
            }
        }

        // Живой таймер "сколько секунд назад обновились данные"
        function updateUpdatedInfo() {
            const updated = document.getElementById('updatedInfo');
            if (!lastUpdated) {
                updated.innerText = 'Данные ещё не получены';
                return;
            }
            const sec = Math.floor((Date.now() - lastUpdated) / 1000);
            const word = sec % 10 === 1 && sec % 100 !== 11 ? 'секунду'
                       : [2,3,4].includes(sec % 10) && ![12,13,14].includes(sec % 100) ? 'секунды'
                       : 'секунд';
            updated.innerText = `Данные обновлены ${sec} ${word} назад • автообновление раз в минуту`;
        }

        checkServerStatus();
        updateUpdatedInfo();
        setInterval(checkServerStatus, 60000); // обновление статуса каждую минуту
        setInterval(updateUpdatedInfo, 1000);  // тикание таймера каждую секунду
    </script>
</body>
</html>
