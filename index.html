
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171329">
    <title>CSEISLVT</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: #171329;
            overflow-x: hidden;
        }

        /* ВИДЕОФОН */

        #video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(10, 8, 25, 0.25),
                rgba(10, 8, 25, 0.48)
            );
            z-index: -1;
            pointer-events: none;
        }

        /* СТРАНИЦА */

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 65px 24px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 38px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.65);
        }

        .header h1 {
            font-size: clamp(42px, 7vw, 76px);
            font-weight: 900;
            letter-spacing: 7px;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 17px;
            color: rgba(255, 255, 255, 0.95);
        }

        /* КАРУСЕЛЬ */

        .carousel {
            width: min(1100px, 100%);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 42px;
        }

        .carousel-window {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            padding: 25px 5px 90px;
            margin-bottom: -90px;
        }

        .cards-track {
            display: flex;
            align-items: flex-start;
            width: max-content;
            gap: 18px;
            will-change: transform;
        }

        /* КАРТОЧКА */

        .card {
            position: relative;
            z-index: 1;
            flex: 0 0 155px;
            width: 155px;
            min-height: 175px;
            height: 175px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;

            padding: 16px 12px;
            border-radius: 18px;
            text-decoration: none;
            color: white;

            background: rgba(25, 20, 48, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.2);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);

            overflow: hidden;

            transition:
                height 0.3s ease,
                transform 0.3s ease,
                background 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .card:hover {
            height: 285px;
            transform: translateY(-8px) scale(1.06);
            background: rgba(55, 42, 95, 0.94);
            border-color: rgba(255, 255, 255, 0.65);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
            z-index: 10;
        }

        .card img {
            flex: 0 0 auto;
            width: 85px;
            height: 85px;
            object-fit: contain;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card-title {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
        }

        /* ОПИСАНИЕ КАРТОЧКИ */

        .card-description {
            width: 100%;
            font-size: 11px;
            line-height: 1.45;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);

            opacity: 0;
            transform: translateY(8px);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .card:hover .card-description {
            opacity: 1;
            transform: translateY(0);
        }

        /* СТРЕЛКИ */

        .arrow {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;

            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;

            color: white;
            background: rgba(20, 15, 40, 0.75);

            font-size: 23px;
            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .arrow:hover {
            background: rgba(100, 75, 160, 0.9);
            transform: scale(1.12);
        }

        /* РАДИО */

        .radio {
            width: min(700px, 100%);
            padding: 22px;
            border-radius: 22px;

            background: rgba(20, 15, 40, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .radio h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .radio p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 18px;
        }

        .radio-embed {
            width: 100%;
            height: 460px;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(10, 8, 25, 0.8);
        }

        .radio-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ТЕЛЕФОНЫ */

        @media (max-width: 760px) {
            .page {
                padding: 45px 18px 35px;
            }

            .header {
                margin-bottom: 28px;
            }

            .header h1 {
                letter-spacing: 4px;
            }

            .header p {
                font-size: 14px;
            }

            .carousel {
                width: 100%;
                display: block;
                margin-bottom: 30px;
            }

            .carousel-window {
                overflow: visible;
                padding: 0;
                margin: 0;
            }

            .cards-track {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 13px;
                transform: none !important;
            }

            .card {
                width: 100%;
                height: auto;
                min-height: 220px;
                flex: initial;
                overflow: visible;
                gap: 10px;
            }

            .card:hover {
                height: auto;
                transform: none;
            }

            .card img {
                width: 72px;
                height: 72px;
            }

            .card-description {
                opacity: 1;
                transform: none;
                font-size: 11px;
            }

            .arrow {
                display: none;
            }

            .radio {
                padding: 16px;
            }

            .radio-embed {
                height: 430px;
            }
        }

        @media (max-width: 380px) {
            .cards-track {
                grid-template-columns: 1fr;
            }
        }
        /* ПОДВАЛ САЙТА */

.footer {
    width: 100%;
    margin-top: 45px;
    padding: 20px 10px;
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
}
    </style>
</head>

<body>

    <!-- ВИДЕОФОН -->
    <video id="video-background" autoplay muted loop playsinline>
        <source src="frutiger_csei2.mp4" type="video/mp4">
    </video>

    <main class="page">

        <!-- ЗАГОЛОВОК -->
        <header class="header">
            <h1>CSEISLVT</h1>
            <p>Лазанья стала еще вкусней, вместо мяса некоарк кот.</p>
        </header>

        <!-- КАРТОЧКИ -->
        <section class="carousel">

            <button class="arrow" id="left-arrow" aria-label="Назад">‹</button>

            <div class="carousel-window" id="carousel-window">
                <div class="cards-track" id="cards-track"></div>
            </div>

            <button class="arrow" id="right-arrow" aria-label="Вперёд">›</button>

        </section>

        <!-- LOFI RADIO -->
        <section class="radio">
            <h2>☁ Lofi Radio</h2>
            <p>Музыка для отдыха, работы и расслабления</p>

            <div class="radio-embed">
                <iframe
                    src="https://www.lofi.cafe/"
                    title="Lofi Cafe Radio"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>
        </section>
    <footer class="footer">
        © 2026 CSEISLVT. Все права защищены.
    </footer>
        
    </main>

    <script>
        const track = document.getElementById("cards-track");
        const leftArrow = document.getElementById("left-arrow");
        const rightArrow = document.getElementById("right-arrow");

        const speed = 0.45;

        let offset = 0;
        let cycleWidth = 0;
        let lastTime = 0;
        let paused = false;

        const cards = [
            {
                url: "https://youtube.com/@cseislvt",
                image: "youtube.jpg",
                title: "YouTube",
                description: "Официальный канал проекта. Видео, стримы и бэкстейдж разработки."
            },
            {
                url: "https://www.youtube.com/@cseislvtVOD",
                image: "cseislvtVOD.png",
                title: "Архив стримов",
                description: "Архивные записи прошедших Twitch-стримов. Полные трансляции, игровые моменты и воспоминания."
            },
            {
                url: "/minecraft-server",
                image: "minecraft.png",
                title: "Minecraft сервер",
                description: "Собственный Minecraft сервер с акцентом на приватность, white-list и отсутствие доната. Нажми, чтобы узнать подробности."
            },
            {
                url: "https://www.tiktok.com/@cseislvt",
                image: "tiktok.png",
                title: "TikTok",
                description: "Короткие ролики, инсайды и забавные моменты из жизни cseislvt."
            },
            {
                url: "https://t.me/cseislvt",
                image: "telegram%20cseislvt.png",
                title: "Telegram",
                description: "Главный новостной хаб. Все важные анонсы и обсуждения комьюнити здесь."
            },
            {
                url: "https://discord.gg/cxBkhgMDf5",
                image: "discord.png",
                title: "Discord",
                description: "Присоединяйся к Discord-сообществу CSEISLVT."
            },
            {
                url: "https://cseislvt.itch.io/chponk",
                image: "chponk.jpg",
                title: "CHPONK!",
                description: "Мой игровой проект на платформе itch.io. Заходи и зацени геймплей."
            }
        ];

        function createCard(item) {
            const link = document.createElement("a");

            link.className = "card";
            link.href = item.url;

            if (item.url.startsWith("http")) {
                link.target = "_blank";
                link.rel = "noopener noreferrer";
            }

            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.title;

            const title = document.createElement("span");
            title.className = "card-title";
            title.textContent = item.title;

            const description = document.createElement("span");
            description.className = "card-description";
            description.textContent = item.description;

            link.appendChild(img);
            link.appendChild(title);
            link.appendChild(description);

            return link;
        }

        function setupCarousel() {
            track.innerHTML = "";

            // Первая группа карточек
            cards.forEach(item => {
                track.appendChild(createCard(item));
            });

            // Вторая группа — копия для бесконечного движения
            cards.forEach(item => {
                track.appendChild(createCard(item));
            });

            requestAnimationFrame(() => {
                const firstCard = track.children[0];
                const nextGroup = track.children[cards.length];

                cycleWidth = nextGroup.offsetLeft - firstCard.offsetLeft;
                offset = 0;

                updatePosition();
            });
        }

        function updatePosition() {
            if (cycleWidth <= 0) return;

            offset = ((offset % cycleWidth) + cycleWidth) % cycleWidth;

            track.style.transform = `translate3d(${-offset}px, 0, 0)`;
        }

        function animate(time) {
            if (!lastTime) lastTime = time;

            const delta = Math.min(time - lastTime, 40);
            lastTime = time;

            if (!paused && window.innerWidth > 760 && cycleWidth > 0) {
                offset += speed * delta / 16;
                updatePosition();
            }

            requestAnimationFrame(animate);
        }

        // Остановка при наведении на ленту
        track.addEventListener("mouseenter", () => {
            paused = true;
        });

        track.addEventListener("mouseleave", () => {
            paused = false;
        });

        // Стрелка влево
        leftArrow.addEventListener("click", () => {
            if (cycleWidth <= 0) return;

            offset -= 300;
            updatePosition();
        });

        // Стрелка вправо
        rightArrow.addEventListener("click", () => {
            if (cycleWidth <= 0) return;

            offset += 300;
            updatePosition();
        });

        // Пересчёт при изменении размера окна
        window.addEventListener("resize", () => {
            setupCarousel();
        });

        setupCarousel();
        requestAnimationFrame(animate);
    </script>

</body>
</html>
