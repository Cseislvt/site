
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171329">
    <title>CSEISLVT</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background: #171329;
            overflow-x: hidden;
        }

        /* ВИДЕОФОН */

        #video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(10, 8, 25, 0.25),
                rgba(10, 8, 25, 0.48)
            );
            z-index: -1;
            pointer-events: none;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */

        .page {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 65px 24px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 38px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.65);
        }

        .header h1 {
            font-size: clamp(42px, 7vw, 76px);
            font-weight: 900;
            letter-spacing: 7px;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 17px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.95);
        }

        /* КАРТОЧКИ */

        .carousel {
            width: min(1100px, 100%);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 42px;
        }

        .carousel-window {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            padding: 12px 3px;
        }

        .cards-track {
            display: flex;
            width: max-content;
            gap: 18px;
            will-change: transform;
        }

        .card {
            flex: 0 0 145px;
            height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            background: rgba(25, 20, 48, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-7px) scale(1.04);
            background: rgba(70, 55, 110, 0.72);
            border-color: rgba(255, 255, 255, 0.55);
        }

        .card img {
            width: 88px;
            height: 88px;
            object-fit: contain;
            border-radius: 12px;
        }

        .card span {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        /* СТРЕЛКИ */

        .arrow {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            color: white;
            background: rgba(20, 15, 40, 0.65);
            font-size: 23px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .arrow:hover {
            background: rgba(100, 75, 160, 0.85);
            transform: scale(1.1);
        }

        /* РАДИО */

        .radio {
            width: min(700px, 100%);
            padding: 22px;
            border-radius: 22px;
            background: rgba(20, 15, 40, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .radio h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .radio p {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            margin-bottom: 18px;
        }

        .radio-embed {
            width: 100%;
            height: 460px;
            overflow: hidden;
            border-radius: 14px;
            background: rgba(10, 8, 25, 0.8);
        }

        .radio-embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* МОБИЛЬНАЯ ВЕРСИЯ */

        @media (max-width: 760px) {
            .page {
                padding: 45px 18px 35px;
            }

            .header {
                margin-bottom: 28px;
            }

            .header h1 {
                letter-spacing: 4px;
            }

            .header p {
                font-size: 14px;
            }

            .carousel {
                width: 100%;
                display: block;
                margin-bottom: 30px;
            }

            .carousel-window {
                overflow: visible;
                padding: 0;
            }

            .cards-track {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 13px;
                transform: none !important;
            }

            .card {
                width: 100%;
                height: 145px;
                flex: initial;
            }

            .card img {
                width: 72px;
                height: 72px;
            }

            .arrow {
                display: none;
            }

            .radio {
                padding: 16px;
            }

            .radio-embed {
                height: 430px;
            }
        }

        @media (max-width: 380px) {
            .cards-track {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- ВИДЕОФОН -->
    <video id="video-background" autoplay muted loop playsinline>
        <source src="frutiger_csei2.mp4" type="video/mp4">
    </video>

    <main class="page">

        <!-- ЗАГОЛОВОК -->
        <header class="header">
            <h1>CSEISLVT</h1>
            <p>Лазанья стала еще вкусней, вместо мяса некоарк кот.</p>
        </header>

        <!-- КАРТОЧКИ -->
        <section class="carousel">

            <button class="arrow" id="left-arrow" aria-label="Назад">‹</button>

            <div class="carousel-window" id="carousel-window">
                <div class="cards-track" id="cards-track">

                    <a class="card" href="https://youtube.com/@cseislvt" target="_blank" rel="noopener noreferrer">
                        <img src="youtube.jpg" alt="YouTube">
                        <span>YouTube</span>
                    </a>

                    <a class="card" href="https://www.youtube.com/@cseislvtVOD" target="_blank" rel="noopener noreferrer">
                        <img src="cseislvtVOD.png" alt="Архив стримов">
                        <span>Архив стримов</span>
                    </a>

                    <a class="card" href="/minecraft-server">
                        <img src="minecraft.png" alt="Minecraft">
                        <span>Minecraft</span>
                    </a>

                    <a class="card" href="https://www.tiktok.com/@cseislvt" target="_blank" rel="noopener noreferrer">
                        <img src="tiktok.png" alt="TikTok">
                        <span>TikTok</span>
                    </a>

                    <a class="card" href="https://t.me/cseislvt" target="_blank" rel="noopener noreferrer">
                        <img src="telegram%20cseislvt.png" alt="Telegram">
                        <span>Telegram</span>
                    </a>

                    <a class="card" href="https://discord.gg/cxBkhgMDf5" target="_blank" rel="noopener noreferrer">
                        <img src="discord.png" alt="Discord">
                        <span>Discord</span>
                    </a>

                    <a class="card" href="https://cseislvt.itch.io/chponk" target="_blank" rel="noopener noreferrer">
                        <img src="chponk.jpg" alt="CHPONK">
                        <span>CHPONK!</span>
                    </a>

                </div>
            </div>

            <button class="arrow" id="right-arrow" aria-label="Вперёд">›</button>

        </section>

        <!-- LOFI RADIO -->
        <section class="radio">
            <h2>☁ Lofi Radio</h2>
            <p>Музыка для отдыха, работы и расслабления</p>

            <div class="radio-embed">
                <iframe
                    src="https://www.lofi.cafe/"
                    title="Lofi Cafe Radio"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    loading="lazy">
                </iframe>
            </div>
        </section>

    </main>

    <script>
        const windowElement = document.getElementById("carousel-window");
        const track = document.getElementById("cards-track");
        const leftArrow = document.getElementById("left-arrow");
        const rightArrow = document.getElementById("right-arrow");

        const speed = 0.45;

        let animationFrame;
        let lastTime = 0;
        let paused = false;

        // Дублируем карточки для бесконечной ленты на ПК.
        function setupCarousel() {
            track.innerHTML = "";

            const cards = [
                {
                    url: "https://youtube.com/@cseislvt",
                    image: "youtube.jpg",
                    title: "YouTube"
                },
                {
                    url: "https://www.youtube.com/@cseislvtVOD",
                    image: "cseislvtVOD.png",
                    title: "Архив стримов"
                },
                {
                    url: "/minecraft-server",
                    image: "minecraft.png",
                    title: "Minecraft"
                },
                {
                    url: "https://www.tiktok.com/@cseislvt",
                    image: "tiktok.png",
                    title: "TikTok"
                },
                {
                    url: "https://t.me/cseislvt",
                    image: "telegram%20cseislvt.png",
                    title: "Telegram"
                },
                {
                    url: "https://discord.gg/cxBkhgMDf5",
                    image: "discord.png",
                    title: "Discord"
                },
                {
                    url: "https://cseislvt.itch.io/chponk",
                    image: "chponk.jpg",
                    title: "CHPONK!"
                }
            ];

            function createCard(item) {
                const link = document.createElement("a");
                link.className = "card";
                link.href = item.url;

                if (item.url.startsWith("http")) {
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                }

                const img = document.createElement("img");
                img.src = item.image;
                img.alt = item.title;

                const span = document.createElement("span");
                span.textContent = item.title;

                link.appendChild(img);
                link.appendChild(span);

                return link;
            }

            cards.forEach(item => track.appendChild(createCard(item)));

            // Копии нужны только для десктопной бесконечной ленты.
            if (window.innerWidth > 760) {
                cards.forEach(item => track.appendChild(createCard(item)));
            }
        }

        function animate(time) {
            if (!lastTime) lastTime = time;

            const delta = Math.min(time - lastTime, 40);
            lastTime = time;

            if (!paused && window.innerWidth > 760) {
                windowElement.scrollLeft += speed * delta / 16;

                const halfWidth = track.scrollWidth / 2;

                if (halfWidth > 0 && windowElement.scrollLeft >= halfWidth) {
                    windowElement.scrollLeft -= halfWidth;
                }
            }

            animationFrame = requestAnimationFrame(animate);
        }

        windowElement.addEventListener("mouseenter", () => {
            paused = true;
        });

        windowElement.addEventListener("mouseleave", () => {
            paused = false;
        });

        windowElement.addEventListener("focusin", () => {
            paused = true;
        });

        windowElement.addEventListener("focusout", () => {
            paused = false;
        });

        leftArrow.addEventListener("click", () => {
            paused = true;
            windowElement.scrollBy({
                left: -300,
                behavior: "smooth"
            });
        });

        rightArrow.addEventListener("click", () => {
            paused = true;
            windowElement.scrollBy({
                left: 300,
                behavior: "smooth"
            });
        });

        let resizeTimeout;

        window.addEventListener("resize", () => {
            clearTimeout(resizeTimeout);

            resizeTimeout = setTimeout(() => {
                windowElement.scrollLeft = 0;
                setupCarousel();
            }, 150);
        });

        setupCarousel();
        animationFrame = requestAnimationFrame(animate);
    </script>

</body>
</html>
