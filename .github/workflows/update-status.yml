name: Update MC Server Status

on:
  schedule:
    - cron: '*/5 * * * *' # Каждые 5 минут
  workflow_dispatch: # Чтобы можно было запустить вручную

permissions:
  contents: write # Разрешаем коммитить файл

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch status from API
        run: |
          curl -s -L "https://api.mcsrvstat.us/3/mc.cseislvt.online" -o status.json
          python3 -c "
          import json, time
          try:
              with open('status.json', 'r') as f:
                  data = json.load(f)
              data['updated_at'] = int(time.time() * 1000)
          except Exception:
              data = {'online': False, 'updated_at': int(time.time() * 1000)}
          with open('status.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore: update server status [skip ci]" || echo "No changes to commit"
          git push
