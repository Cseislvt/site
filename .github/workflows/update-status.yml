name: Update MC Server Status

on:
  schedule:
    - cron: '*/5 * * * *' # Каждые 5 минут
  workflow_dispatch: # Ручной запуск

permissions:
  contents: write # Разрешаем коммитить файл

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install minecraft-server-util

      - name: Ping server and update status.json
        run: node scripts/update-status.js
        env:
          MC_HOST: mc.cseislvt.online
          MC_PORT: '25565'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore: update server status [skip ci]" || echo "No changes to commit"
          git push
